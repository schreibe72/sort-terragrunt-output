name: Build and Release

on:
  push:
    branches: [main, 'rc/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY: sort-terragrunt-output

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so there is no go.sum to key the cache on
      - run: go vet ./...
      - run: go test ./...

  version:
    # releases are only published from main and rc/** (also for manual runs)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/rc/'))
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags are needed to compute the version
      - id: next
        shell: bash # enables pipefail, so a failing script fails the step despite tee
        env:
          # main publishes final releases, rc/** branches publish release candidates
          MODE: ${{ github.ref == 'refs/heads/main' && 'release' || 'rc' }}
        run: .github/scripts/next-version.sh "$MODE" | tee -a "$GITHUB_OUTPUT"

  build:
    if: needs.version.outputs.release == 'true'
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so there is no go.sum to key the cache on
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${BINARY}_linux_${GOARCH}" .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/${{ env.BINARY }}_linux_*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create tag and release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ${BINARY}_linux_* > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "${flags[@]}"
